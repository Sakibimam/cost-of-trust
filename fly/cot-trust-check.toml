app = "cot-trust-check"
primary_region = "sin"

[build]
  dockerfile = "cot-trust-check.Dockerfile"

[processes]
  worker = "node --import tsx src/worker.ts"
  server = "node --import tsx src/server.ts"

[http_service]
  internal_port = 8788
  processes = ["server"]
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
